[device]
codename = "dada"
brand = "Xiaomi"
model = "Xiaomi 15"
ab = true
soc = { hans = "骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite 行動平台", en = "Snapdragon® 8 Elite Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

# The secure element's library, libEseUtils, picks the driver it drives when
# ro.arch is this value; the element's service starts before the installed
# system's properties are reachable.
[props]
"ro.arch" = "exynos9810"

[display]
# persist.sys.miui_resolution in the odm partition's build.prop, which is
# vendor.display.default_resolution there as well.
width = 1200
height = 2670
density = 520

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen is Synaptics TouchComm over SPI behind Xiaomi's touch
# layer, the one touch driver the phone's own modules.load lists. The
# secure element's GPIO driver makes the node its service opens; the
# phone's own start loads it from the vendor partition too.
load = ["synaptics_tcm2", "stm_st54se_gpio"]

# The secure element's driver makes this node root-owned, while its service
# runs as system in the nfc group, as the phone's own init gives it.
[[owners]]
user = "system"
group = "nfc"
mode = 0o660
paths = ["/dev/st54spi_gpio"]

# As on the 17 Ultra, no init script of the phone's starts touch_report:
# the touch feature service turns the controller's raw frames into
# touches with /odm/lib64/libtouchreport.so, and a recovery runs none of
# it. Told through Xiaomi's touch layer, the driver has the controller
# report positions itself; that is known of the 17 Ultra's Synaptics
# controller and not yet tried on this phone's.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The secure world reaches back into Android through the listeners this
# daemon registers; without them the key service cannot use any key.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# The opener the secure world's apps are reached through by programs that
# speak to them as GlobalPlatform's TEE client does. It loads the apps from
# the modem partition's firmware folder as they are first asked for. Its
# init script has init make the socket it serves on; a recovery runs no
# init of the phone's, so it runs as root and makes the socket itself.
[[service]]
path = "/vendor/bin/hlosminkdaemon"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "root"
groups = ["root"]

# The app the secure element's service hands its commands to, kept loaded
# here: this recovery starts after the point the phone's own start loads it,
# and the service opens it only when the first command comes, which fails
# while it is not there. The program holds it loaded until the phone stops.
[[service]]
path = "/skyward/qsee-probe"
args = ["hold"]
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["nfc", "system"]

# The key service, which is the only thing that can use the keys the phone
# wrapped in hardware. The same program serves the secure clock and the
# shared secret, and the remotely provisioned component, which the phone
# describes apart from it.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

# The directory the phone's hardware services of the older kind register
# with. A recovery carries none of it, so it is the installed system's own
# program, running against the installed system's own libraries. It says it
# is up by the property the services themselves wait on.
[[service]]
path = "/mnt/system_ext/bin/hwservicemanager"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_property = "hwservicemanager.ready"
user = "system"
groups = ["system", "readproc"]

# The credential service: it is what the secure world has check a screen
# lock, and the only thing that can hand out the note the key service wants
# before it will use a key a screen lock guards. This build's is the newer
# kind, which registers with the phone's service directory.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-service-qti"
# Its implementation library sits in the vendor partition's hardware
# folder, which a recovery's loader does not search on its own.
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
# The build keeps this one out of its manifest folder, among fragments for
# the models it serves; this is the smallest that describes the service.
description = "/vendor/etc/vintf/manifest_kera.xml"
user = "system"
groups = ["system"]

# The secure element, which the weaver's slots are kept in: it opens a
# channel to the element through the secure world, so it comes after the
# opener and before the weaver. Its instance is the one this build's
# manifest for it describes.
[[service]]
path = "/vendor/bin/hw/android.hardware.secure_element-service.qti"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw"]
ready_service = "android.hardware.secure_element.ISecureElement/eSE1"
user = "system"
groups = ["nfc", "system"]

# The directory the framework's secure element service would register with,
# which a recovery does not carry: this bridge takes its place, and speaks
# to the element's service above on the weaver's behalf.
[[service]]
path = "/skyward/sebridge"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.se.omapi.ISecureElementService/default"
user = "root"
groups = ["root"]

# The weaver, in the secure element Thales made for this build: every
# user's secret is bound to a slot of it, with a screen lock or without. It
# reaches the element through the service above. Its libraries reach into
# the installed system for the support a vendor program of this kind is
# given at a start, which the recovery's own copy of the system lacks.
[[service]]
path = "/odm/bin/hw/android.hardware.weaver-service.thales"
libraries = ["/system/lib64", "/vendor/lib64", "/odm/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.weaver.IWeaver/default"
user = "vendor_thales_weaver"
groups = ["vendor_thales_weaver", "system", "drmrpc"]

# The boot control, which says which slot the bootloader starts next and
# switches it, writing where the bootloader reads it. It comes last: the
# phone is usable without it.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot-service.qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.boot.IBootControl/default"
user = "root"
groups = ["root"]

# The firmware of the WLAN chip, and the apps the secure world loads for the
# secure element's service, are on the modem partition, which the phone
# mounts at /vendor/firmware_mnt and its own recovery leaves unmounted. The
# weaver reaches the secure element through one of those apps.
[firmware]
partition = "modem"

# The persist partition, which the phone mounts at /mnt/vendor/persist and
# its own recovery leaves unmounted. The secure world keeps its own files
# there, through a listener qseecomd registers: among them what the key
# service needs to use a key that cannot be rolled back, such as the one
# guarding each user's secret. The WLAN's MAC address is there as well.
[partitions]
mounted = ["persist"]

# WLAN: the peach node in the device tree, which either of the two Peach
# drivers the phone's own modules.load lists and its modules.blocklist
# leaves may drive, by the chip's revision; the phone loads both, and so do
# these. Their cfg80211 asks for rfkill, one of the kernel's own modules in
# system_dlkm, as the 17 Ultra's does. Its recovery covers the vendor
# partition's firmware folder with the modem's, as the 13 Ultra's does, so
# the settings and the MAC address are given to the loader again, under
# the names each driver asks for: the settings from the vendor partition,
# the address from where the vendor's links point in persist.
# wpa_supplicant runs on the recovery's own libraries before the vendor
# partition's, as on the 17 Ultra.
[wlan]
modules = ["rfkill", "qca_cld3_peach", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/peach/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/peach/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
    { name = "wlan/qca_cld/peach_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/peach_v2/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS4.0.3.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of.
[stock]
version = "OS4.0.3.0.XOCCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.3.0.XOCCNXM/dada-ota_full-OS4.0.3.0.XOCCNXM-user-17.0-88bbad7913.zip"
recovery = "878d186cb51bf303da382a8a24d1fece64e1c8c8fbd489732cf6e4bf390542ac"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), whose driver says the
# motor's resonant frequency as the 17 Ultra's does; the click is made from
# samples at that frequency, and the strengths are the 17 Ultra's. Neither
# is yet tried on this phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }
